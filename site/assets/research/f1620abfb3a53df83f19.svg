<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="title desc"><title id="title">Question 30: cumulative heat measurements</title><desc id="desc">Straight cumulative-heat plots for X and Y start from zero, with time on the horizontal axis.</desc><rect width="800" height="450" fill="white"/><g stroke="black" stroke-width="2.5" fill="none" stroke-linejoin="round"><text font-family="Arial,sans-serif" font-size="20" fill="black" stroke="none" x="90" y="32" >H (joules)</text><line x1="90" y1="350" x2="720" y2="350" /><line x1="90" y1="350" x2="90" y2="60" /><line x1="90" y1="350" x2="90" y2="357" /><text font-family="Arial,sans-serif" font-size="20" fill="black" stroke="none" x="90" y="385" text-anchor="middle">0</text><line x1="350" y1="350" x2="350" y2="357" /><text font-family="Arial,sans-serif" font-size="20" fill="black" stroke="none" x="350" y="385" text-anchor="middle">20</text><line x1="610" y1="350" x2="610" y2="357" /><text font-family="Arial,sans-serif" font-size="20" fill="black" stroke="none" x="610" y="385" text-anchor="middle">40</text><line x1="83" y1="350" x2="90" y2="350" /><text font-family="Arial,sans-serif" font-size="20" fill="black" stroke="none" x="74" y="357" text-anchor="end">0</text><line x1="83" y1="230" x2="90" y2="230" /><text font-family="Arial,sans-serif" font-size="20" fill="black" stroke="none" x="74" y="237" text-anchor="end">120</text><line x1="83" y1="110" x2="90" y2="110" /><text font-family="Arial,sans-serif" font-size="20" fill="black" stroke="none" x="74" y="117" text-anchor="end">240</text><text font-family="Arial,sans-serif" font-size="20" fill="black" stroke="none" x="700" y="425" text-anchor="end">t (seconds)</text><line x1="350" y1="350" x2="350" y2="85" class="grid" stroke="#b5b5b5" stroke-width="1"/><line x1="610" y1="350" x2="610" y2="85" class="grid" stroke="#b5b5b5" stroke-width="1"/><line x1="90" y1="230" x2="640" y2="230" class="grid" stroke="#b5b5b5" stroke-width="1"/><line x1="90" y1="110" x2="640" y2="110" class="grid" stroke="#b5b5b5" stroke-width="1"/><line x1="90" y1="350" x2="610" y2="110" class="data" stroke="black" stroke-width="4"/><line x1="90" y1="350" x2="610" y2="230" class="data" stroke="black" stroke-width="4"/><circle cx="610" cy="110" r="5" fill="black"/><circle cx="610" cy="230" r="5" fill="black"/><text font-family="Arial,sans-serif" font-size="20" fill="black" stroke="none" x="647" y="110" >X</text><text font-family="Arial,sans-serif" font-size="20" fill="black" stroke="none" x="647" y="234" >Y</text></g></svg>
