<svg xmlns="http://www.w3.org/2000/svg" width="800" height="615" viewBox="0 0 800 615"><title>Alternative warming-track paths</title><desc>Two disconnected alternative paths S and T, with segment lengths and a minimum conducting-area constraint.</desc><rect width="800" height="615" fill="white"/><g stroke="black" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><text font-family="Arial,DejaVu Sans,sans-serif" fill="black" stroke="none" x="28" y="38" font-size="24" text-anchor="start">Alternative track paths (not connected together)</text><text font-family="Arial,DejaVu Sans,sans-serif" fill="black" stroke="none" x="35" y="92" font-size="24" text-anchor="start">Path S</text><line x1="150" y1="135" x2="530" y2="135"/><circle cx="150" cy="135" r="5" fill="black"/><circle cx="530" cy="135" r="5" fill="black"/><text font-family="Arial,DejaVu Sans,sans-serif" fill="black" stroke="none" x="340" y="113" font-size="22" text-anchor="middle">0.80 m</text><text font-family="Arial,DejaVu Sans,sans-serif" fill="black" stroke="none" x="35" y="232" font-size="24" text-anchor="start">Path T</text><line x1="150" y1="270" x2="530" y2="270"/><line x1="530" y1="270" x2="530" y2="370"/><line x1="530" y1="370" x2="340" y2="370"/><circle cx="150" cy="270" r="5" fill="black"/><circle cx="340" cy="370" r="5" fill="black"/><text font-family="Arial,DejaVu Sans,sans-serif" fill="black" stroke="none" x="340" y="251" font-size="22" text-anchor="middle">0.60 m</text><text font-family="Arial,DejaVu Sans,sans-serif" fill="black" stroke="none" x="548" y="327" font-size="22" text-anchor="start">0.30 m</text><text font-family="Arial,DejaVu Sans,sans-serif" fill="black" stroke="none" x="427" y="405" font-size="22" text-anchor="middle">0.30 m</text><rect x="55" y="450" width="685" height="95" fill="white"/><text font-family="Arial,DejaVu Sans,sans-serif" fill="black" stroke="none" x="80" y="488" font-size="22" text-anchor="start">Minimum conducting area for either path:</text><text font-family="Arial,DejaVu Sans,sans-serif" fill="black" stroke="none" x="80" y="526" font-size="24" text-anchor="start">0.20 mm²</text><text font-family="Arial,DejaVu Sans,sans-serif" fill="black" stroke="none" x="55" y="581" font-size="21" text-anchor="start">Ends are terminals; dimensions give actual wire length.</text></g></svg>
