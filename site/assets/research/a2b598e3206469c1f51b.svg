<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="title desc"><title id="title">Question 16: staged power schedule</title><desc id="desc">Horizontal power segments and labelled interval boundaries define a complete eight-minute schedule. Dashed verticals indicate instantaneous switching.</desc><rect width="800" height="450" fill="white"/><g stroke="black" stroke-width="2.5" fill="none" stroke-linejoin="round"><text font-family="Arial,sans-serif" font-size="20" fill="black" stroke="none" x="90" y="32" >P (watts)</text><line x1="90" y1="350" x2="720" y2="350" /><line x1="90" y1="350" x2="90" y2="60" /><line x1="90" y1="350" x2="90" y2="357" /><text font-family="Arial,sans-serif" font-size="20" fill="black" stroke="none" x="90" y="385" text-anchor="middle">0</text><line x1="230" y1="350" x2="230" y2="357" /><text font-family="Arial,sans-serif" font-size="20" fill="black" stroke="none" x="230" y="385" text-anchor="middle">2</text><line x1="510" y1="350" x2="510" y2="357" /><text font-family="Arial,sans-serif" font-size="20" fill="black" stroke="none" x="510" y="385" text-anchor="middle">6</text><line x1="650" y1="350" x2="650" y2="357" /><text font-family="Arial,sans-serif" font-size="20" fill="black" stroke="none" x="650" y="385" text-anchor="middle">8</text><line x1="83" y1="350" x2="90" y2="350" /><text font-family="Arial,sans-serif" font-size="20" fill="black" stroke="none" x="74" y="357" text-anchor="end">0</text><line x1="83" y1="270" x2="90" y2="270" /><text font-family="Arial,sans-serif" font-size="20" fill="black" stroke="none" x="74" y="277" text-anchor="end">200</text><line x1="83" y1="190" x2="90" y2="190" /><text font-family="Arial,sans-serif" font-size="20" fill="black" stroke="none" x="74" y="197" text-anchor="end">400</text><line x1="83" y1="110" x2="90" y2="110" /><text font-family="Arial,sans-serif" font-size="20" fill="black" stroke="none" x="74" y="117" text-anchor="end">600</text><text font-family="Arial,sans-serif" font-size="20" fill="black" stroke="none" x="700" y="425" text-anchor="end">t (minutes)</text><line x1="230" y1="350" x2="230" y2="90" class="grid" stroke="#b5b5b5" stroke-width="1"/><line x1="510" y1="350" x2="510" y2="90" class="grid" stroke="#b5b5b5" stroke-width="1"/><line x1="650" y1="350" x2="650" y2="90" class="grid" stroke="#b5b5b5" stroke-width="1"/><line x1="90" y1="270" x2="675" y2="270" class="grid" stroke="#b5b5b5" stroke-width="1"/><line x1="90" y1="190" x2="675" y2="190" class="grid" stroke="#b5b5b5" stroke-width="1"/><line x1="90" y1="110" x2="675" y2="110" class="grid" stroke="#b5b5b5" stroke-width="1"/><line x1="90" y1="110" x2="230" y2="110" class="data" stroke="black" stroke-width="4"/><line x1="230" y1="270" x2="510" y2="270" class="data" stroke="black" stroke-width="4"/><line x1="510" y1="350" x2="650" y2="350" class="data" stroke="black" stroke-width="4"/><line x1="230" y1="110" x2="230" y2="270" stroke-dasharray="6 5"/><line x1="510" y1="270" x2="510" y2="350" stroke-dasharray="6 5"/></g></svg>
