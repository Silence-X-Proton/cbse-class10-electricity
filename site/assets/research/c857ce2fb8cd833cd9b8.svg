<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="title desc"><title id="title">Question 5: two cylindrical wires</title><desc id="desc">Wire dimensions are specified by length and diameter labels; the drawings are not to scale.</desc><rect width="800" height="450" fill="white"/><g stroke="black" stroke-width="2.5" fill="none" stroke-linejoin="round"><text font-family="Arial,sans-serif" font-size="20" fill="black" stroke="none" x="45" y="40" >Same material and temperature; dimensions are labelled.</text><text font-family="Arial,sans-serif" font-size="20" fill="black" stroke="none" x="65" y="105" >X</text><rect x="145" y="105" width="280" height="35" fill="white"/><ellipse cx="425" cy="122.5" rx="10" ry="17.5" fill="white"/><line x1="145" y1="165" x2="425" y2="165" /><line x1="145" y1="155" x2="145" y2="175" /><line x1="425" y1="155" x2="425" y2="175" /><text font-family="Arial,sans-serif" font-size="20" fill="black" stroke="none" x="285" y="195" text-anchor="middle">length L</text><line x1="480" y1="105" x2="480" y2="140" /><line x1="470" y1="105" x2="490" y2="105" /><line x1="470" y1="140" x2="490" y2="140" /><text font-family="Arial,sans-serif" font-size="20" fill="black" stroke="none" x="510" y="133" >diameter d</text><text font-family="Arial,sans-serif" font-size="20" fill="black" stroke="none" x="65" y="270" >Y</text><rect x="145" y="255" width="420" height="70" fill="white"/><ellipse cx="565" cy="290" rx="14" ry="35" fill="white"/><line x1="145" y1="350" x2="565" y2="350" /><line x1="145" y1="340" x2="145" y2="360" /><line x1="565" y1="340" x2="565" y2="360" /><text font-family="Arial,sans-serif" font-size="20" fill="black" stroke="none" x="355" y="390" text-anchor="middle">length 2L</text><line x1="620" y1="255" x2="620" y2="325" /><line x1="610" y1="255" x2="630" y2="255" /><line x1="610" y1="325" x2="630" y2="325" /><text font-family="Arial,sans-serif" font-size="20" fill="black" stroke="none" x="642" y="285" >diameter</text><text font-family="Arial,sans-serif" font-size="20" fill="black" stroke="none" x="665" y="313" >2d</text><text font-family="Arial,sans-serif" font-size="20" fill="black" stroke="none" x="45" y="430" >Not to scale.</text></g></svg>
