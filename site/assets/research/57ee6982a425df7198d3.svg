<svg xmlns="http://www.w3.org/2000/svg" width="800" height="535" viewBox="0 0 800 535"><title>Wire redesign specification</title><desc>Original wire dimensions and resistance, followed by maximum-length and minimum-area limits for a new uniform wire.</desc><rect width="800" height="535" fill="white"/><g stroke="black" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><text font-family="Arial,DejaVu Sans,sans-serif" fill="black" stroke="none" x="30" y="40" font-size="25" text-anchor="start">Original wire and manufacturing limits</text><line x1="100" y1="115.0" x2="650" y2="115.0"/><line x1="100" y1="185.0" x2="650" y2="185.0"/><ellipse cx="100" cy="150" rx="12" ry="35.0" fill="white"/><ellipse cx="650" cy="150" rx="12" ry="35.0" fill="white"/><text font-family="Arial,DejaVu Sans,sans-serif" fill="black" stroke="none" x="365" y="88" font-size="23" text-anchor="middle">Length = 0.80 m</text><text font-family="Arial,DejaVu Sans,sans-serif" fill="black" stroke="none" x="100" y="230" font-size="23" text-anchor="start">Conducting area = 0.50 mm²</text><text font-family="Arial,DejaVu Sans,sans-serif" fill="black" stroke="none" x="100" y="274" font-size="23" text-anchor="start">Measured resistance = 0.25 Ω</text><rect x="80" y="310" width="650" height="145" fill="white"/><text font-family="Arial,DejaVu Sans,sans-serif" fill="black" stroke="none" x="105" y="345" font-size="23" text-anchor="start">Limits for the new uniform wire:</text><text font-family="Arial,DejaVu Sans,sans-serif" fill="black" stroke="none" x="105" y="388" font-size="23" text-anchor="start">Maximum length: 1.70 m</text><text font-family="Arial,DejaVu Sans,sans-serif" fill="black" stroke="none" x="105" y="428" font-size="23" text-anchor="start">Minimum conducting area: 0.20 mm²</text><text font-family="Arial,DejaVu Sans,sans-serif" fill="black" stroke="none" x="80" y="505" font-size="21" text-anchor="start">Use all the original conducting material; no loss.</text></g></svg>
