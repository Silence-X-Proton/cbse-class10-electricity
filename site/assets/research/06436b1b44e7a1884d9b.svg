<svg xmlns="http://www.w3.org/2000/svg" width="800" height="530" viewBox="0 0 800 530"><title>Uniform samples</title><desc>Three cylindrical samples P, Q and T with labelled lengths, cross-sections and measured resistances.</desc><rect width="800" height="530" fill="white"/><g stroke="black" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><text font-family="Arial,DejaVu Sans,sans-serif" fill="black" stroke="none" x="30" y="38" font-size="25" text-anchor="start">Sample dimensions and measured resistance</text><text font-family="Arial,DejaVu Sans,sans-serif" fill="black" stroke="none" x="40" y="126" font-size="25" text-anchor="start">P</text><line x1="140" y1="101.0" x2="370" y2="101.0"/><line x1="140" y1="139.0" x2="370" y2="139.0"/><ellipse cx="140" cy="120" rx="12" ry="19.0" fill="white"/><ellipse cx="370" cy="120" rx="12" ry="19.0" fill="white"/><text font-family="Arial,DejaVu Sans,sans-serif" fill="black" stroke="none" x="140" y="81" font-size="22" text-anchor="start">L = 1.0 m</text><text font-family="Arial,DejaVu Sans,sans-serif" fill="black" stroke="none" x="140" y="185" font-size="22" text-anchor="start">Conducting area = 0.50 mm²</text><text font-family="Arial,DejaVu Sans,sans-serif" fill="black" stroke="none" x="600" y="125" font-size="22" text-anchor="start">R = 4 Ω</text><text font-family="Arial,DejaVu Sans,sans-serif" fill="black" stroke="none" x="40" y="256" font-size="25" text-anchor="start">Q</text><line x1="140" y1="231.0" x2="560" y2="231.0"/><line x1="140" y1="269.0" x2="560" y2="269.0"/><ellipse cx="140" cy="250" rx="12" ry="19.0" fill="white"/><ellipse cx="560" cy="250" rx="12" ry="19.0" fill="white"/><text font-family="Arial,DejaVu Sans,sans-serif" fill="black" stroke="none" x="140" y="211" font-size="22" text-anchor="start">L = 2.0 m</text><text font-family="Arial,DejaVu Sans,sans-serif" fill="black" stroke="none" x="140" y="315" font-size="22" text-anchor="start">Conducting area = 0.50 mm²</text><text font-family=