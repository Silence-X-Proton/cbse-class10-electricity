<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="title desc"><title id="title">Question 10: switched branch</title><desc id="desc">Two resistor branches are connected between common left and right nodes. Switch S interrupts only the lower branch.</desc><rect width="800" height="450" fill="white"/><g stroke="black" stroke-width="2.5" fill="none" stroke-linejoin="round"><text font-family="Arial,sans-serif" font-size="20" fill="black" stroke="none" x="45" y="35" >S is initially open</text><line x1="145" y1="100" x2="300" y2="100" /><rect x="300" y="83" width="160" height="34" fill="white"/><text font-family="Arial,sans-serif" font-size="20" fill="black" stroke="none" x="380" y="72" text-anchor="middle">12 Ω</text><line x1="460" y1="100" x2="680" y2="100" /><line x1="145" y1="100" x2="145" y2="275" /><line x1="145" y1="295" x2="145" y2="360" /><line x1="120" y1="275" x2="170" y2="275" /><line x1="130" y1="295" x2="160" y2="295" /><text font-family="Arial,sans-serif" font-size="20" fill="black" stroke="none" x="73" y="265" >+</text><text font-family="Arial,sans-serif" font-size="20" fill="black" stroke="none" x="72" y="310" >−</text><text font-family="Arial,sans-serif" font-size="20" fill="black" stroke="none" x="38" y="345" >12 V</text><line x1="145" y1="360" x2="680" y2="360" /><line x1="680" y1="100" x2="680" y2="360" /><line x1="145" y1="220" x2="230" y2="220" /><circle cx="230" cy="220" r="5" fill="black"/><line x1="230" y1="220" x2="270" y2="193" /><circle cx="290" cy="220" r="5" fill="black"/><line x1="290" y1="220" x2="360" y2="220" /><rect x="360" y="203" width="160" height="34" fill="white"/><line x1="520" y1="220" x2="680" y2="220" /><text font-family="Arial,sans-serif" font-size="20" fill="black" stroke="none" x="440" y="190" text-anchor="middle">6 Ω</text><text font-family="Arial,sans-serif" font-size="20" fill="black" stroke="none" x="260" y="173" text-anchor="middle">S</text><circle cx="145" cy="220" r="5" fill="black"/><circle cx="680" cy="220" r="5" fill="black"/></g></svg>
