<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="title desc"><title id="title">Question 23: measurement circuit</title><desc id="desc">An ammeter is in the main series path. A voltmeter is attached between labelled nodes M and N.</desc><rect width="800" height="450" fill="white"/><g stroke="black" stroke-width="2.5" fill="none" stroke-linejoin="round"><line x1="90" y1="110" x2="160" y2="110" /><circle cx="185" cy="110" r="25" fill="white"/><text font-family="Arial,sans-serif" font-size="20" fill="black" stroke="none" x="185" y="117" text-anchor="middle">A</text><line x1="210" y1="110" x2="260" y2="110" /><rect x="260" y="93" width="110" height="34" fill="white"/><text font-family="Arial,sans-serif" font-size="20" fill="black" stroke="none" x="315" y="75" text-anchor="middle">4 Ω</text><line x1="370" y1="110" x2="480" y2="110" /><rect x="480" y="93" width="110" height="34" fill="white"/><text font-family="Arial,sans-serif" font-size="20" fill="black" stroke="none" x="535" y="75" text-anchor="middle">6 Ω</text><line x1="590" y1="110" x2="690" y2="110" /><line x1="690" y1="110" x2="690" y2="370" /><line x1="690" y1="370" x2="90" y2="370" /><line x1="90" y1="110" x2="90" y2="275" /><line x1="65" y1="275" x2="115" y2="275" /><line x1="75" y1="295" x2="105" y2="295" /><line x1="90" y1="295" x2="90" y2="370" /><text font-family="Arial,sans-serif" font-size="20" fill="black" stroke="none" x="27" y="267" >+</text><text font-family="Arial,sans-serif" font-size="20" fill="black" stroke="none" x="27" y="314" >−</text><text font-family="Arial,sans-serif" font-size="20" fill="black" stroke="none" x="120" y="320" >10 V</text><circle cx="420" cy="110" r="5" fill="black"/><circle cx="650" cy="110" r="5" fill="black"/><text font-family="Arial,sans-serif" font-size="20" fill="black" stroke="none" x="420" y="80" text-anchor="middle">M</text><text font-family="Arial,sans-serif" font-size="20" fill="black" stroke="none" x="650" y="80" text-anchor="middle">N</text><line x1="420" y1="110" x2="420" y2="230" /><line x1="420" y1="230" x2="510" y2="230" /><circle cx="535" cy="230" r="25" fill="white"/><text font-family="Arial,sans-serif" font-size="20" fill="black" stroke="none" x="535" y="237" text-anchor="middle">V</text><line x1="560" y1="230" x2="650" y2="230" /><line x1="650" y1="230" x2="650" y2="110" /><text font-family="Arial,sans-serif" font-size="20" fill="black" stroke="none" x="240" y="425" >Ideal meters; dots mark connected nodes.</text></g></svg>
