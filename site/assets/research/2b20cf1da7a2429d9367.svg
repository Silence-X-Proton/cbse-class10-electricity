<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="title desc"><title id="title">Question 4: I–V plots</title><desc id="desc">Straight lines for X and Y start at the origin. Current is on the vertical axis and voltage on the horizontal axis.</desc><rect width="800" height="450" fill="white"/><g stroke="black" stroke-width="2.5" fill="none" stroke-linejoin="round"><text font-family="Arial,sans-serif" font-size="20" fill="black" stroke="none" x="90" y="32" >I (amperes)</text><line x1="90" y1="350" x2="720" y2="350" /><line x1="90" y1="350" x2="90" y2="60" /><line x1="90" y1="350" x2="90" y2="357" /><text font-family="Arial,sans-serif" font-size="20" fill="black" stroke="none" x="90" y="385" text-anchor="middle">0</text><line x1="270" y1="350" x2="270" y2="357" /><text font-family="Arial,sans-serif" font-size="20" fill="black" stroke="none" x="270" y="385" text-anchor="middle">2</text><line x1="450" y1="350" x2="450" y2="357" /><text font-family="Arial,sans-serif" font-size="20" fill="black" stroke="none" x="450" y="385" text-anchor="middle">4</text><line x1="630" y1="350" x2="630" y2="357" /><text font-family="Arial,sans-serif" font-size="20" fill="black" stroke="none" x="630" y="385" text-anchor="middle">6</text><line x1="83" y1="350" x2="90" y2="350" /><text font-family="Arial,sans-serif" font-size="20" fill="black" stroke="none" x="74" y="357" text-anchor="end">0</text><line x1="83" y1="270" x2="90" y2="270" /><text font-family="Arial,sans-serif" font-size="20" fill="black" stroke="none" x="74" y="277" text-anchor="end">0.2</text><line x1="83" y1="190" x2="90" y2="190" /><text font-family="Arial,sans-serif" font-size="20" fill="black" stroke="none" x="74" y="197" text-anchor="end">0.4</text><line x1="83" y1="110" x2="90" y2="110" /><text font-family="Arial,sans-serif" font-size="20" fill="black" stroke="none" x="74" y="117" text-anchor="end">0.6</text><text font-family="Arial,sans-serif" font-size="20"