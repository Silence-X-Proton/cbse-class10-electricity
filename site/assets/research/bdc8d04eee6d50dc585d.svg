<svg xmlns="http://www.w3.org/2000/svg" width="800" height="455" viewBox="0 0 800 455"><title>Meter connections</title><desc>Voltmeter connects between nodes M and P. Wire X lies between M and N; a 4 ohm resistor lies between N and P.</desc><rect width="800" height="455" fill="white"/><g stroke="black" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><text font-family="Arial,DejaVu Sans,sans-serif" fill="black" stroke="none" x="30" y="38" font-size="25" text-anchor="start">Actual measurement arrangement</text><line x1="170" y1="205" x2="255" y2="205"/><rect x="255" y="187" width="90" height="36" fill="white"/><text font-family="Arial,DejaVu Sans,sans-serif" fill="black" stroke="none" x="300" y="173" font-size="22" text-anchor="middle">Wire X</text><line x1="345" y1="205" x2="450" y2="205"/><rect x="450" y="187" width="115" height="36" fill="white"/><text font-family="Arial,DejaVu Sans,sans-serif" fill="black" stroke="none" x="507" y="173" font-size="22" text-anchor="middle">4 Ω</text><line x1="565" y1="205" x2="660" y2="205"/><circle cx="170" cy="205" r="5" fill="black"/><circle cx="390" cy="205" r="5" fill="black"/><circle cx="660" cy="205" r="5" fill="black"/><text font-family="Arial,DejaVu Sans,sans-serif" fill="black" stroke="none" x="150" y="242" font-size="22" text-anchor="start">M</text><text font-family="Arial,DejaVu Sans,sans-serif" fill="black" stroke="none" x="380" y="242" font-size="22" text-anchor="start">N</text><text font-family="Arial,DejaVu Sans,sans-serif" fill="black" stroke="none" x="673" y="210" font-size="22" text-anchor="start">P</text><line x1="170" y1="205" x2="170" y2="95"/><line x1="170" y1="95" x2="379" y2="95"/><circle cx="410" cy="95" r="31" fill="white"/><text font-family="Arial,DejaVu Sans,sans-serif" fill="black" stroke="none" x="410" y="103" font-size="25" text-anchor="middle">V</text><line x1="441" y1="95" x2="660" y2="95"/><line x1="660" y1="95" x2="660" y2="350"/><line x1="660" y1="350" x2="425" y2="350"/><line x1="425" y1="329" x2="425" y2="371"/><line x1="402" y1="317" x2="402" y2="383"/><line x1="402" y1="350" x2="242" y2="350"/><circle cx="210" cy="350" r="32" fill="white"/><text font-family="Arial,DejaVu Sans,sans-serif" fill="black" stroke="none" x="210" y="359" font-size="25" text-anchor="middle">A</text><line x1="178" y1="350" x2="85" y2="350"/><line x1="85" y1="350" x2="85" y2="205"/><line x1="85" y1="205" x2="170" y2="205"/><text font-family="Arial,DejaVu Sans,sans-serif" fill="black" stroke="none" x="385" y="307" font-size="22" text-anchor="start">+</text><text font-family="Arial,DejaVu Sans,sans-serif" fill="black" stroke="none" x="438" y="319" font-size="22" text-anchor="start">−</text><text font-family="Arial,DejaVu Sans,sans-serif" fill="black" stroke="none" x="325" y="420" font-size="21" text-anchor="start">Ideal source and meters</text></g></svg>
