<svg xmlns="http://www.w3.org/2000/svg" width="800" height="595" viewBox="0 0 800 595" role="img" aria-labelledby="title desc"><title id="title">Q29 — Dimensions of wire samples</title><desc id="desc">Three cylindrical wires with labelled lengths and diameters.</desc><rect width="800" height="595" fill="white"/><g stroke="black" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" font-family="Arial, sans-serif"><g fill="black" stroke="none"><text stroke="none" fill="black" font-family="sans-serif" x="400" y="36" font-size="24" text-anchor="middle">Q29 — Dimensions of wire samples</text></g><rect x="200" y="115" width="220" height="30" fill="white"/><ellipse cx="200" cy="130" rx="12" ry="15" fill="white"/><ellipse cx="420" cy="130" rx="12" ry="15" fill="white"/><text stroke="none" fill="black" font-family="sans-serif" x="60" y="137" font-size="22" text-anchor="middle">X</text><text stroke="none" fill="black" font-family="sans-serif" x="310" y="97" font-size="22" text-anchor="middle">length L</text><line x1="165" y1="115" x2="165" y2="145"/><line x1="157" y1="115" x2="173" y2="115"/><line x1="157" y1="145" x2="173" y2="145"/><text stroke="none" fill="black" font-family="sans-serif" x="133" y="137" font-size="22" text-anchor="middle">d</text><rect x="200" y="245" width="340" height="60" fill="white"/><ellipse cx="200" cy="275" rx="12" ry="30" fill="white"/><ellipse cx="540" cy="275" rx="12" ry="30" fill="white"/><text stroke="none" fill="black" font-family="sans-serif" x="60" y="282" font-size="22" text-anchor="middle">Y</text><text stroke="none" fill="black" font-family="sans-serif" x="370" y="227" font-size="22" text-anchor="middle">length 2L</text><line x1="165" y1="245" x2="165" y2="305"/><line x1="157" y1="245" x2="173" y2="245"/><line x1="157" y1="305" x2="173" y2="305"/><text stroke="none" fill="black" font-family="sans-serif" x="126" y="282" font-size="22" text-anchor="middle">2d</text><rect x="200" y="410" width="490" height="60" fill="white"/><ellipse cx="200" cy="440" rx="12" ry="30" fill="white"/><ellipse cx="690" cy="440" rx="12" ry="30" fill="white"/><text stroke="none" fill="black" font-family="sans-serif" x="60" y="447" font-size="22" text-anchor="middle">Z</text><text stroke="none" fill="black" font-family="sans-serif" x="445" y="392" font-size="22" text-anchor="middle">length 4L</text><line x1="165" y1="410" x2="165" y2="470"/><line x1="157" y1="410" x2="173" y2="410"/><line x1="157" y1="470" x2="173" y2="470"/><text stroke="none" fill="black" font-family="sans-serif" x="126" y="447" font-size="22" text-anchor="middle">2d</text><text stroke="none" fill="black" font-family="sans-serif" x="400" y="530" font-size="20" text-anchor="middle">d and 2d label diameters, not areas.</text><text stroke="none" fill="black" font-family="sans-serif" x="400" y="560" font-size="20" text-anchor="middle">All wires: same material and temperature; not to scale.</text></g></svg>
