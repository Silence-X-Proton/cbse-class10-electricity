<svg xmlns="http://www.w3.org/2000/svg" width="800" height="435" viewBox="0 0 800 435"><title>Resistor circuit</title><desc>A 3 ohm resistor in the common path, two 6 ohm branches and an ideal 9 volt source. Dots mark connections.</desc><rect width="800" height="435" fill="white"/><g stroke="black" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><text font-family="Arial,DejaVu Sans,sans-serif" fill="black" stroke="none" x="30" y="37" font-size="25" text-anchor="start">Circuit for Question 6</text><line x1="80" y1="140" x2="165" y2="140"/><rect x="165" y="122" width="105" height="36" fill="white"/><text font-family="Arial,DejaVu Sans,sans-serif" fill="black" stroke="none" x="217" y="110" font-size="22" text-anchor="middle">3 Ω</text><line x1="270" y1="140" x2="350" y2="140"/><line x1="350" y1="95" x2="350" y2="240"/><line x1="350" y1="95" x2="460" y2="95"/><rect x="460" y="77" width="110" height="36" fill="white"/><text font-family="Arial,DejaVu Sans,sans-serif" fill="black" stroke="none" x="515" y="64" font-size="22" text-anchor="middle">6 Ω</text><line x1="570" y1="95" x2="690" y2="95"/><line x1="690" y1="95" x2="690" y2="330"/><line x1="350" y1="240" x2="460" y2="240"/><rect x="460" y="222" width="110" height="36" fill="white"/><text font-family="Arial,DejaVu Sans,sans-serif" fill="black" stroke="none" x="515" y="208" font-size="22" text-anchor="middle">6 Ω</text><line x1="570" y1="240" x2="690" y2="240"/><circle cx="350" cy="140" r="5" fill="black"/><circle cx="350" cy="95" r="5" fill="black"/><circle cx="350" cy="240" r="5" fill="black"/><circle cx="690" cy="95" r="5" fill="black"/><circle cx="690" cy="240" r="5" fill="black"/><text font-family="Arial,DejaVu Sans,sans-serif" fill="black" stroke="none" x="320" y="170" font-size="22" text-anchor="start">L</text><text font-family="Arial,DejaVu Sans,sans-serif" fill="black" stroke="none" x="705" y="248" font-size="22" text-anchor="start">R</text><line x1="80" y1="140" x2="80" y2="330"/>